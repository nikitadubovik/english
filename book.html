<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C1 Advanced — Select Test</title>
<link rel="stylesheet" href="css/base.css?v=5">
<script src="js/ui.js?v=4"></script>
<script src="js/books.js?v=1"></script>
</head>
<body>

<div class="header">
  <a class="brand" href="index.html">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M3 6c5-1.6 9-.9 12 1.6v19c-3-2.3-7-3-12-1.6V6Zm26 0c-5-1.6-9-.9-12 1.6v19c3-2.3 7-3 12-1.6V6Z"/></svg>
    <div><span class="brand-name">C1 Advanced</span><span class="brand-sub">Practice library</span></div>
  </a>
  <div class="header-icons">
    <button class="hbtn" type="button" data-options aria-label="Options" title="Options"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
  </div>
</div>

<div class="menu-container">
  <div class="breadcrumb">
    <a href="index.html">Library</a>
    <span class="sep">›</span>
    <span id="bookTitle">Book</span>
  </div>

  <h1 id="pageTitle">Select a test</h1>
  <p class="subtitle">Choose a test.</p>

  <div class="menu-grid row" id="testGrid"></div>
</div>

<script>
  const book = new URLSearchParams(window.location.search).get('book') || 'cae1';
  const info = window.C1_BOOK(book) || { id: book, title: 'Unknown book', tests: [] };

  document.getElementById('bookTitle').textContent = info.title;
  document.getElementById('pageTitle').textContent = info.title;
  document.title = 'C1 Advanced — ' + info.title;

  // The tests stand in one row (one column on a narrow screen)
  const grid = document.getElementById('testGrid');
  grid.style.setProperty('--cols', Math.max(1, info.tests.length));
  info.tests.forEach(n => {
    const card = document.createElement('a');
    card.className = 'menu-card';
    card.href = `test.html?book=${encodeURIComponent(info.id)}&test=${n}`;
    const title = document.createElement('span');
    title.className = 'card-title';
    title.textContent = 'Test ' + n;
    card.appendChild(title);
    grid.appendChild(card);
  });
</script>

</body>
</html>
