<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C1 Advanced — Select Test</title>
<link rel="stylesheet" href="css/base.css">
<script src="js/ui.js"></script>
</head>
<body>

<div class="header">
  <a class="brand" href="index.html">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M3 6c5-1.6 9-.9 12 1.6v19c-3-2.3-7-3-12-1.6V6Zm26 0c-5-1.6-9-.9-12 1.6v19c3-2.3 7-3 12-1.6V6Z"/></svg>
    <div><span class="brand-name">C1 Advanced</span><span class="brand-sub">Practice library</span></div>
  </a>
  <div class="header-icons">
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch between light and dark theme" title="Light / dark theme">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 7.5 7.5 0 1 0 20 14.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    </button>
  </div>
</div>

<div class="menu-container">
  <div class="breadcrumb">
    <a href="index.html">Library</a>
    <span class="sep">›</span>
    <span id="bookTitle">Book</span>
  </div>

  <h1 id="pageTitle">Select a test</h1>
  <p class="subtitle">Pick any of the four tests in this book.</p>

  <div class="menu-grid" id="testGrid"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const book = params.get('book') || 'cae1';

  const BOOKS = {
    cae1: { title: 'Cambridge English Advanced 1', tests: 4 },
    cae2: { title: 'Cambridge English Advanced 2', tests: 6 },
    cae3: { title: 'Cambridge English Advanced 3', tests: 4 },
    cae4: { title: 'Cambridge English Advanced 4', tests: 4 },
    cae5: { title: 'Cambridge English Advanced 5', tests: 4 },
  };

  // FIX 1: Define info so the script knows how many tests exist
  const info = BOOKS[book] || { title: 'Unknown book', tests: 4 };

  // FIX 2: Restore the titles so the user knows which book they opened
  document.getElementById('bookTitle').textContent = info.title;
  document.getElementById('pageTitle').textContent = info.title;

  const grid = document.getElementById('testGrid');

  // FIX 3: Improved Logic for test numbering (Works for all books)
  // Extract the number from 'cae2' -> 2
  const bookNum = parseInt(book.replace('cae', '')); 
  // Calculate start (e.g., Book 2: (2-1)*4 + 1 = 5)
  const startNum = ((bookNum - 1) * 4) + 1;
  const endNum = startNum + (info.tests - 1);
  
  for (let i = startNum; i <= endNum; i++) {
    const card = document.createElement('a');
    card.className = 'menu-card';
    card.href = `test.html?book=${book}&test=${i}`;
    
    card.innerHTML = `
      <span class="card-label">Test ${i}</span>
      <span class="card-title">Practice Test ${i}</span>
    `;
    grid.appendChild(card);
  }
</script>

</body>
</html>
