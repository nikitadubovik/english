<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C1 Advanced — Select Paper</title>
<link rel="stylesheet" href="css/base.css?v=5">
<script src="js/ui.js?v=4"></script>
<script src="js/books.js?v=1"></script>
</head>
<body>

<div class="header">
  <a class="brand" href="index.html">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M3 6c5-1.6 9-.9 12 1.6v19c-3-2.3-7-3-12-1.6V6Zm26 0c-5-1.6-9-.9-12 1.6v19c3-2.3 7-3 12-1.6V6Z"/></svg>
    <div><span class="brand-name">C1 Advanced</span><span class="brand-sub">Practice library</span></div>
  </a>
  <div class="header-icons">
    <button class="hbtn" type="button" data-options aria-label="Options" title="Options"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
  </div>
</div>

<div class="menu-container">
  <div class="breadcrumb">
    <a href="index.html">Library</a>
    <span class="sep">›</span>
    <a id="bookLink" href="#">Book</a>
    <span class="sep">›</span>
    <span id="testTitle">Test</span>
  </div>

  <h1 id="pageTitle">Test</h1>
  <p class="subtitle">Choose which paper to take.</p>

  <div class="menu-grid row" id="paperGrid" style="--cols: 4">
    <a class="menu-card" id="readingCard">
      <span class="card-label">Paper 1</span>
      <span class="card-title">Reading and Use of English</span>
      <span class="card-meta" data-ready="1 hour 30 minutes · 56 questions">1 hour 30 minutes · 56 questions</span>
    </a>
    <a class="menu-card" id="writingCard">
      <span class="card-label">Paper 2</span>
      <span class="card-title">Writing</span>
      <span class="card-meta" data-ready="1 hour 30 minutes · 2 tasks">1 hour 30 minutes · 2 tasks</span>
    </a>
    <a class="menu-card" id="listeningCard">
      <span class="card-label">Paper 3</span>
      <span class="card-title">Listening</span>
      <span class="card-meta" data-ready="About 40 minutes · 30 questions">About 40 minutes · 30 questions</span>
    </a>
    <a class="menu-card disabled">
      <span class="card-label">Paper 4</span>
      <span class="card-title">Speaking</span>
      <span class="card-meta">Coming soon</span>
    </a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const book = params.get('book') || 'cae1';
  const test = params.get('test') || '1';
  const info = window.C1_BOOK(book) || { id: book, title: book };
  const q = `book=${encodeURIComponent(book)}&test=${encodeURIComponent(test)}`;

  document.getElementById('bookLink').textContent = info.title;
  document.getElementById('bookLink').href = `book.html?book=${encodeURIComponent(book)}`;
  document.getElementById('testTitle').textContent = `Test ${test}`;
  document.getElementById('pageTitle').textContent = `${info.title} — Test ${test}`;

  // A paper opens if its file is there; otherwise its card says "Coming soon".
  // If the check itself fails (the page was opened from disk, say), the cards stay open.
  const PAPERS = [
    ['readingCard', `exam.html?${q}&paper=reading`, 'rue.json'],
    ['writingCard', `writing.html?${q}`, 'wri.json'],
    ['listeningCard', `listening.html?${q}`, 'lis.json'],
  ];
  const grid = document.getElementById('paperGrid');
  grid.style.visibility = 'hidden';
  const checks = PAPERS.map(([id, href, file]) => {
    const card = document.getElementById(id);
    card.href = href;
    return fetch(`content/${encodeURIComponent(book)}/test${encodeURIComponent(test)}/${file}`, { method: 'HEAD' })
      .then(res => {
        if (res.status !== 404) return;
        card.classList.add('disabled');
        card.removeAttribute('href');
        card.querySelector('.card-meta').textContent = 'Coming soon';
      })
      .catch(() => {});
  });
  const reveal = () => { grid.style.visibility = ''; };
  Promise.all(checks).then(reveal);
  setTimeout(reveal, 1500);
</script>

</body>
</html>
