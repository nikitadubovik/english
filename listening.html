<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C1 Advanced — Listening</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/exam.css">
<link rel="stylesheet" href="css/listening.css?v=2">
<script src="js/ui.js"></script>
</head>
<body>

<div class="header">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M3 6c5-1.6 9-.9 12 1.6v19c-3-2.3-7-3-12-1.6V6Zm26 0c-5-1.6-9-.9-12 1.6v19c3-2.3 7-3 12-1.6V6Z"/></svg>
    <div><span class="brand-name">C1 Advanced</span><span class="brand-sub">Listening</span></div>
  </div>
  <div class="candidate-id">Candidate ID</div>
  <div class="header-icons">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2.5 9.5a14 14 0 0 1 19 0M5.8 13a9.3 9.3 0 0 1 12.4 0M9 16.4a4.6 4.6 0 0 1 6 0"/><circle cx="12" cy="19.6" r="1.3" fill="currentColor" stroke="none"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15l1.5-2ZM10 21h4"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.5H6a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h11.5a2 2 0 0 0 2-2v-5"/><path d="M17.8 3.3a1.9 1.9 0 0 1 2.8 2.7L12 14.7l-3.6.9.9-3.6 8.5-8.7Z"/></svg>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch between light and dark theme" title="Light / dark theme">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 7.5 7.5 0 1 0 20 14.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    </button>
  </div>
</div>

<div class="instructions" id="instructions">
  <h2 id="instr-title">Questions 1–6</h2>
  <p id="instr-text">You will hear three different extracts. For each question, choose the correct answer. There are two questions for each extract.</p>
</div>

<div class="content-wrap">
  <div class="content part-view active" data-view="1">
    <div class="lis-container" id="p1Container"></div>
  </div>
  <div class="content part-view" data-view="2">
    <div class="lis-container" id="p2Container"></div>
  </div>
  <div class="content part-view" data-view="3">
    <div class="lis-container" id="p3Container"></div>
  </div>
  <div class="content part-view" data-view="4">
    <div class="lis-container" id="p4Container"></div>
  </div>
</div>

<div class="results-screen" id="finalResults">
  <h1>Your results</h1>
  <p class="lead">Listening — C1 Advanced</p>
  <div id="finalScoreCards"></div>
  <h2>Your answers</h2>
  <div class="answer-review" id="answerReview"></div>
  <div class="results-actions">
    <button class="btn-secondary" id="backToTestBtn">Back to the test</button>
  </div>
</div>

<div class="nav-arrows">
  <button id="prevBtn" title="Previous">←</button>
  <button class="primary" id="nextBtn" title="Next">→</button>
</div>

<div class="footer" id="footer"></div>

<script src="js/listening.js"></script>
</body>
</html>
